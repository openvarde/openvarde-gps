services:
  gpsd:
    image: alpine:3.22
    container_name: openvarde-gpsd
    restart: unless-stopped

    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0

    command: >
      sh -c "
      apk add --no-cache gpsd gpsd-clients &&
      exec gpsd -N -n -G /dev/ttyUSB0
      "

    ports:
      - "2947:2947"

  gps:
    build: .
    container_name: openvarde-gps
    restart: unless-stopped

    environment:
      GPSD_HOST: gpsd
      GPSD_PORT: 2947
      MQTT_URL: ${MQTT_URL}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      OPENVARDE_DATA_DIR: /var/lib/openvarde

    volumes:
      - /var/lib/openvarde:/var/lib/openvarde:ro

    depends_on:
      - gpsd
